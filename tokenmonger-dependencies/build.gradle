plugins {
    id 'java-platform'
}

javaPlatform {
    allowDependencies()
}

dependencies {
    api platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    api platform("com.contentgrid.configuration:contentgrid-configuration-bom:0.2.0")
    constraints {
        api 'org.bouncycastle:bcpkix-jdk18on:1.86'
    }
}
