plugins {
	id 'base'
	id 'com.diffplug.spotless' apply false
}

allprojects {
	pluginManager.withPlugin('io.freefair.lombok') {
		lombok {
			version = lombokVersion
		}
	}

	pluginManager.withPlugin('java') {
		// Opts in to the conventions plugin's Spotless defaults (removeUnusedImports()).
		apply plugin: 'com.diffplug.spotless'

		java {
			toolchain {
				languageVersion = JavaLanguageVersion.of(21)
			}
		}

		tasks.withType(JavaCompile).configureEach {
			options.encoding = 'UTF-8'
			options.compilerArgs.add("-parameters")
		}

		tasks.named('test') {
			useJUnitPlatform()
		}
	}

	pluginManager.withPlugin('jacoco') {
		jacocoTestReport {
			reports {
				xml.required = true
			}
		}
	}

	pluginManager.withPlugin('org.sonarqube') {
		sonarqube {
			properties {
				property "sonar.projectKey", "contentgrid-tokenmonger"
				property "sonar.organization", "xenit-eu"
				property "sonar.host.url", "https://sonarcloud.io"
			}
		}

	}
}
