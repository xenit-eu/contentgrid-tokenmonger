plugins {
	id 'org.springframework.boot'
	id 'java'
	id 'jacoco'
	id 'io.freefair.lombok'
	id 'org.sonarqube'
	id 'org.ajoberstar.grgit'
}

bootRun {
	args = ["--spring.profiles.active=bootRun"]
}

java {
	sourceCompatibility = '17'
}

springBoot {
	buildInfo {
		properties {
			additional = [
					"git": grgit.describe(always: true, longDescr: true, tags: true)
			]
		}
	}
}

bootBuildImage {
	def dockerImageRepo = "ghcr.io/xenit-eu/contentgrid-tokenmonger"
	imageName = "${dockerImageRepo}:${project.version}"
	tags = "${project.version}".endsWith('SNAPSHOT') ? [ "${dockerImageRepo}:SNAPSHOT" ] : null

	docker {
		publishRegistry {
			url = project.findProperty('DOCKER_PUBLISH_REGISTRY_URL')
			username = project.findProperty('DOCKER_PUBLISH_REGISTRY_USERNAME')
			password = project.findProperty('DOCKER_PUBLISH_REGISTRY_PASSWORD')
		}
	}
}

dependencies {
	implementation platform(project(':tokenmonger-dependencies'))
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-authorization-server'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'com.contentgrid.spring:contentgrid-spring-boot-autoconfigure:0.15.0'
	implementation('org.bouncycastle:bcpkix-jdk18on:1.78.1') {
		because "necessary to load PEM-encoded private keys into JWKs"
	}
	implementation("org.springframework.security:spring-security-oauth2-authorization-server") {
		version {
			strictly '1.3.0'
		}
	}

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'com.github.tomakehurst:wiremock-jre8-standalone:3.0.1'
}
