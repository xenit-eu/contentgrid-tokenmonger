plugins {
	id 'org.springframework.boot'
	id 'java'
	id 'jacoco'
	id 'io.freefair.lombok'
	id 'org.sonarqube'
	id 'org.ajoberstar.grgit'
}

bootRun {
	args = ["--spring.profiles.active=bootRun"]
}

java {
	sourceCompatibility = '21'
}

springBoot {
	buildInfo {
		properties {
			additional = [
					"git": grgit.describe(always: true, longDescr: true, tags: true)
			]
		}
	}
}

bootBuildImage {
	def dockerImageRepo = "ghcr.io/xenit-eu/contentgrid-tokenmonger"
	imageName = "${dockerImageRepo}:${project.version}"
	tags = "${project.version}".endsWith('SNAPSHOT') ? [ "${dockerImageRepo}:SNAPSHOT" ] : null

	docker {
		publishRegistry {
			url = project.findProperty('DOCKER_PUBLISH_REGISTRY_URL')
			username = project.findProperty('DOCKER_PUBLISH_REGISTRY_USERNAME')
			password = project.findProperty('DOCKER_PUBLISH_REGISTRY_PASSWORD')
		}
	}
}

dependencies {
	implementation platform(project(':tokenmonger-dependencies'))
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	runtimeOnly 'org.springframework.security:spring-security-oauth2-jose'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-mustache'

	implementation ('com.contentgrid.common:contentgrid-common-spring-boot-starter:0.1.5') {
		capabilities {
			requireFeature('spring-boot-3')
		}
	}

	runtimeOnly 'com.contentgrid.spring:contentgrid-spring-boot-autoconfigure:0.18.1'

	implementation 'com.contentgrid.configuration:contentgrid-configuration-contentgrid-apps'
	runtimeOnly 'com.contentgrid.configuration:contentgrid-configuration-autoconfigure'
	runtimeOnly('com.contentgrid.configuration:contentgrid-configuration-kubernetes-fabric8') {
		// We need an older kubernetes client than provided by contentgrid configuration to be compatible with Spring Boot
		exclude group: 'io.fabric8'
	}
	runtimeOnly 'com.contentgrid.configuration:contentgrid-configuration-properties-spring'
	runtimeOnly 'org.springframework.cloud:spring-cloud-kubernetes-fabric8-autoconfig:3.3.3'

	runtimeOnly('org.bouncycastle:bcpkix-jdk18on') {
		because "necessary to load PEM-encoded private keys into JWKs"
	}

	runtimeOnly ('io.micrometer:micrometer-registry-prometheus') {
		because "Put on classpath to trigger prometheus registry autoconfigure and activate prom metrics endpoint. ACC-2952"
	}

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'com.github.tomakehurst:wiremock-jre8-standalone:3.0.1'
	testImplementation 'org.awaitility:awaitility:4.3.0'

	testImplementation 'org.bouncycastle:bcpkix-jdk18on'
	testImplementation 'io.fabric8:kubernetes-client'
	testImplementation 'org.springframework.cloud:spring-cloud-kubernetes-fabric8-autoconfig:3.3.3'

	testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
	testImplementation 'org.testcontainers:k3s'
	testImplementation 'org.testcontainers:junit-jupiter'

}
