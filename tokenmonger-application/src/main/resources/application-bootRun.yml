server:
  port: 9089
  error.include-message: always

management:
  server:
    port: 9189

contentgrid:
  tokenmonger:
    applications:
      registration:
        test1:
          application-id: test1
          domains:
            - test1.example
            - test1.invalid
        test2:
          application-id: test2
          domains:
            - test2.example

    extension-identity:
      issuer: http://localhost:8082/realms/extensions

    user-application-access:
      jwk-set-uri: http://localhost:9081/actuator/jwks/authentication

    extension-application-access:
      issuer: http://localhost:9089/authentication/system
      active-signing-keys: file:signing-keys/active.pem

    user-extension-access:
      issuer: http://localhost:9089/authentication/external
      active-signing-keys: file:signing-keys/active.pem
      registration:
        test:
          extension-id: test
          resource-uris:
            - http://example.com/
            - http://example.org/

    extension-delegated-application-access:
      issuer: http://localhost:9089/authentication/delegated
      active-signing-keys: file:signing-keys/active.pem

