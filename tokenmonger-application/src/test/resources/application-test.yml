spring:
  security:
    oauth2:
      authorizationserver:
        client:
          test:
            registration:
              client-id: "test-client"
              client-secret: "{noop}test-client-secret"
              client-authentication-methods:
                - "client_secret_basic"
                - "client_secret_post"
              authorization-grant-types:
                - "authorization_code"
                - "client_credentials"
                - "https://contentgrid.cloud/oauth2/grant/extension-token"
                - "urn:ietf:params:oauth:grant-type:token-exchange"
              redirect-uris:
                - "http://extension-system.test/oauth2"
          machine-learning:
            registration:
              client-id: "machine-learning"
              client-secret: "{noop}machine-learning-secret"
              client-authentication-methods:
                - "client_secret_basic"
                - "client_secret_post"
              authorization-grant-types:
                - "authorization_code"
                - "client_credentials"
                - "https://contentgrid.cloud/oauth2/grant/extension-token"
                - "urn:ietf:params:oauth:grant-type:token-exchange"
              redirect-uris:
                - "http://ml-system.test/oauth2"

contentgrid:
  tokenmonger:
    applications:
      registration:
        test1:
          application-id: test1
          domains:
            - test1.app.contentgrid.example
            - my-domain.app.contentgrid.example
        test2:
          application-id: test2
          domains:
            - test2.app.contentgrid.example
    extensions:
      registration:
        test:
          extension-id: test-extension
          resource-uris:
            - http://extension-system.test/
        ml:
          extension-id: ml
          resource-uris:
            - http://ml-system.test/
    extension-identity:
      issuer: https://auth.contentgrid.test/realms/extensions
      audience: tokenmonger

    extension-application-access:
      issuer: http://extensions.contentgrid.test/authentication/system
      active-signing-keys: file:eaat.json

    user-extension-access:
      issuer: http://extensions.contentgrid.test/authentication/external
      active-signing-keys: file:ueat.json

    extension-delegated-application-access:
      issuer: http://extensions.contentgrid.test/authentication/delegated
      active-signing-keys: file:edaat.json
